(() =&gt; {
  const root = document.getElementById(&#x27;codebase-scope-20261014&#x27;);

  const saved = window.openai?.widgetState?.privateContent;
  if (saved &amp;&amp; [&#x27;all&#x27;,&#x27;tests&#x27;,&#x27;core&#x27;].includes(saved.scope)) { scope = saved.scope; selected = saved.selected; }

  const filter = s =&gt; data.files.filter(f =&gt; s === &#x27;all&#x27; || (s === &#x27;core&#x27; ? f.c : f.t));
  function persist() {
    window.openai?.setWidgetState?.({modelContent:{scope,selected},privateContent:{scope,selected}})?.catch(() =&gt; {});
  }
  function updateGroups() {
    active = filter(scope);
    groups = data.groups.map(g =&gt; ({...g,files:active.filter(f =&gt; f.g === g.id)})).filter(g =&gt; g.files.length);
    groups.forEach(g =&gt; { g.n = sum(g.files); });
    groups.sort((a,b) =&gt; b.n - a.n);
    if (!groups.some(g =&gt; g.id === selected) &amp;&amp; selected !== &#x27;_small&#x27;) selected = groups[0]?.id;
    const total = sum(active);
    root.querySelector(&#x27;#cb-size&#x27;).textContent = nf.format(active.length)+&#x27; file · &#x27;+nf.format(total)+&#x27; dòng · &#x27;+(100*total/data.total).toLocaleString(&#x27;vi-VN&#x27;,{maximumFractionDigits:1})+&#x27;% toàn repo&#x27;;
    scopeInput.value = scope;
  }
  function selectedFiles() {
    if (selected === &#x27;_small&#x27;) return active.filter(f =&gt; small.has(f.g));
    return active.filter(f =&gt; f.g === selected);
  }
  function detail() {
    const g = groups.find(g =&gt; g.id === selected);
    const files = selectedFiles();
    root.querySelector(&#x27;#cb-selected&#x27;).textContent = selected === &#x27;_small&#x27; ? &#x27;Các cụm nhỏ&#x27; : (g?.label || &#x27;Cụm mã&#x27;);
    const state = g ? data.status[g.cat] : &#x27;Nhiều nhóm chức năng&#x27;;
    root.querySelector(&#x27;#cb-detail&#x27;).textContent = nf.format(files.length)+&#x27; file · &#x27;+nf.format(sum(files))+&#x27; dòng · &#x27;+state;
    const body = root.querySelector(&#x27;#cb-files&#x27;);
    body.replaceChildren();
    files.slice().sort((a,b) =&gt; b.n-a.n).slice(0,6).forEach(f =&gt; {
      const row = document.createElement(&#x27;tr&#x27;);
      const name = document.createElement(&#x27;td&#x27;), size = document.createElement(&#x27;td&#x27;), code = document.createElement(&#x27;code&#x27;);
      code.textContent = f.p; name.append(code); size.textContent = nf.format(f.n); size.className = &#x27;text-end tabular-nums&#x27;;
      row.append(name,size); body.append(row);
    });
  }
  function select(id) { selected = id; groupInput.value = id; detail(); draw(false); persist(); }
  function options() {
    groupInput.replaceChildren();
    groups.forEach(g =&gt; { const o = document.createElement(&#x27;option&#x27;); o.value=g.id; o.textContent=g.label; groupInput.append(o); });

  }
  function labelLines(label,width,maxLines) {

      if (ctx.measureText(next).width &lt;= width) line=next;
      else { if(line) lines.push(line); line=word; }
    }
    if(line) lines.push(line);
    if(lines.length &gt; maxLines) { lines.length=maxLines; lines[maxLines-1]=lines[maxLines-1].replace(/.$/,&#x27;…&#x27;); }

    let leaves=[];
    for(let pass=0;pass&lt;5;pass++) {
      const large=groups.filter(g =&gt; !small.has(g.id)).map(g =&gt; ({...g}));
      if(small.size) { const files=active.filter(f =&gt; small.has(f.g)); large.push({id:&#x27;_small&#x27;,label:&#x27;Các cụm nhỏ&#x27;,short:&#x27;Cụm nhỏ&#x27;,cat:&#x27;other&#x27;,n:sum(files),files}); }
      const hierarchy=d3.hierarchy({children:large}).sum(d =&gt; d.children ? 0 : d.n).sort((a,b) =&gt; b.value-a.value);
      d3.treemap().size([width,height]).paddingInner(4).round(true)(hierarchy);
      leaves=hierarchy.leaves();
      const tooSmall=leaves.filter(d =&gt; d.data.id !== &#x27;_small&#x27; &amp;&amp; (d.x1-d.x0&lt;44 || d.y1-d.y0&lt;44));

    const reduced=window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
