[project]
name = "selective-delegation-agent"
version = "0.1.0"
description = "Selective Delegation Agent — Local-first macOS desktop assistant for document search, contextual reasoning, and bounded execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.8.0",
    "PyQt6-Qt6>=6.8.0",
    "certifi>=2024.0.0",
    "jsonschema>=4.18.0",
    "httpx>=0.28.0",
    "pillow>=10.0.0",
    "ctranslate2>=4.8.0",
    "sentencepiece>=0.2.0",
    "numpy>=2.0.0",
    "fastembed>=0.8.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "watchdog>=5.0.0",
    "psutil>=6.0.0",
    "pynput>=1.8.0",
    "rich>=13.0.0",
    "scipy>=1.14.0",
    "pyswisseph>=2.10.0",
    "pyobjc-core>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "scikit-learn>=1.5.0",
    "gymnasium>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
